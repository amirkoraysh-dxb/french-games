<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F3F6FF;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5B6889;
    --coral:#FF6B5B;
    --sun:#FFC145;
    --bamboo:#2FBF8F;
    --sky:#4C8DFF;
    --purple:#A78BFA;
    --gold:#E8A317;
    --teal:#0EA5A5;
    --shadow: 31,42,68;
    --card-back-a:#DCEBFF;
    --card-back-b:#C7DEFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1830;
      --surface:#182448;
      --ink:#EEF3FF;
      --ink-soft:#9FAFD4;
      --coral:#FF8A7C;
      --sun:#FFD873;
      --bamboo:#4CE0B3;
      --sky:#7AAEFF;
      --purple:#C6B7FF;
      --gold:#FFCB66;
      --teal:#4DD9D9;
      --shadow: 3,6,16;
      --card-back-a:#233363;
      --card-back-b:#1B2850;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1830;
    --surface:#182448;
    --ink:#EEF3FF;
    --ink-soft:#9FAFD4;
    --coral:#FF8A7C;
    --sun:#FFD873;
    --bamboo:#4CE0B3;
    --sky:#7AAEFF;
    --purple:#C6B7FF;
    --gold:#FFCB66;
    --teal:#4DD9D9;
    --shadow: 3,6,16;
    --card-back-a:#233363;
    --card-back-b:#1B2850;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Quicksand', system-ui, sans-serif;
    padding:20px 16px 48px;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{ font-family:'Baloo 2', 'Quicksand', system-ui, sans-serif; text-wrap:balance; margin:0; }
  
  button{ font-family:inherit; color:inherit; }
  a{ color:inherit; }
  .swatch{
    border:3px solid rgba(120,130,150,.28);
    display:inline-flex; align-items:center; justify-content:center; line-height:1;
  }

  .wrap{ max-width:900px; margin:0 auto; }

  /* ---------- header ---------- */
  .top{
    display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap;
  }
  .mascot{ width:56px; height:56px; flex:none; filter: drop-shadow(0 3px 6px rgba(var(--shadow),0.15)); }
  .top h1{ font-size:clamp(24px,5vw,32px); color:var(--ink); }
  .top .tag{ color:var(--ink-soft); font-size:15px; font-weight:600; margin-top:2px; }
  .top-spacer{ flex:1; }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink); border:none;
    padding:10px 16px; border-radius:999px; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
    transition:transform .12s ease;
  }
  .back-btn:hover{ transform:translateY(-1px); }
  .back-btn:active{ transform:translateY(1px); }
  .back-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--sky); outline-offset:2px;
  }

  /* ---------- home: subject tiles ---------- */
  .tiles{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; margin-bottom:20px;
  }
  .tile{
    --accent: var(--sky);
    background:var(--surface);
    border-radius:28px;
    padding:22px 20px 20px;
    text-align:left;
    border:none;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 0 rgba(var(--shadow),0.08), 0 2px 14px rgba(var(--shadow),0.10);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:10px;
    color:var(--ink);
  }
  .tile:hover{ transform:translateY(-4px); }
  .tile:active{ transform:translateY(1px); box-shadow:0 4px 0 rgba(var(--shadow),0.08); }
  .tile::before{
    content:""; position:absolute; inset:0 auto auto 0; width:100%; height:8px;
    background:var(--accent);
  }
  .tile .icon{
    font-size:38px; width:64px; height:64px; border-radius:20px;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .tile h2{ font-size:21px; }
  .tile .preview{ font-size:22px; letter-spacing:2px; opacity:.9; min-height:28px; }
  .tile .stars{ margin-top:auto; font-size:16px; letter-spacing:2px; }

  .intro-line{ color:var(--ink-soft); font-size:16px; font-weight:600; margin:2px 0 20px; }

  /* ---------- sound sort banner (home) ---------- */
  .sound-sort-banner{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--purple), color-mix(in srgb, var(--purple) 65%, #000 14%));
    color:#fff; border-radius:24px; padding:20px 22px; margin-bottom:22px;
    box-shadow:0 8px 0 color-mix(in srgb, var(--purple) 55%, #000 25%);
    transition:transform .12s ease;
  }
  .sound-sort-banner:hover{ transform:translateY(-2px); }
  .sound-sort-banner:active{ transform:translateY(2px); }
  .sound-sort-banner .ss-icon{ font-size:38px; flex:none; }
  .sound-sort-banner .ss-title{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; }
  .sound-sort-banner .ss-desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- songs banner (home) + song list + song detail ---------- */
  .songs-banner{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--coral), color-mix(in srgb, var(--coral) 65%, #000 14%));
    color:#fff; border-radius:24px; padding:20px 22px; margin-bottom:22px;
    box-shadow:0 8px 0 color-mix(in srgb, var(--coral) 55%, #000 25%);
    transition:transform .12s ease;
  }
  .songs-banner:hover{ transform:translateY(-2px); }
  .songs-banner:active{ transform:translateY(2px); }
  .songs-banner .ss-icon{ font-size:38px; flex:none; }
  .songs-banner .ss-title{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; }
  .songs-banner .ss-desc{ font-size:14px; opacity:.92; font-weight:600; }

  .song-tile{
    --accent: var(--coral);
    background:var(--surface); border-radius:24px; padding:20px 18px; text-align:left; border:none; cursor:pointer;
    box-shadow:0 8px 0 rgba(var(--shadow),0.08), 0 2px 14px rgba(var(--shadow),0.10);
    display:flex; align-items:center; gap:14px; width:100%; margin-bottom:14px; color:var(--ink);
    transition:transform .12s ease;
  }
  .song-tile:hover{ transform:translateY(-2px); }
  .song-tile .icon{
    font-size:32px; width:52px; height:52px; border-radius:16px; flex:none;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .song-tile .song-title{ font-weight:800; font-size:17px; }
  .song-tile .song-fr{ color:var(--ink-soft); font-weight:700; font-size:14px; margin-top:2px; }

  .song-line{
    background:var(--surface); border-radius:22px; padding:20px 18px; margin-bottom:14px; cursor:pointer; border:none;
    width:100%; text-align:center; box-shadow:0 3px 12px rgba(var(--shadow),0.08); color:var(--ink);
  }
  .song-line .fr{ font-size:24px; font-weight:700; line-height:1.5; }
  .song-line .say{ font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .song-line .en{ font-size:14px; color:var(--ink-soft); margin-top:6px; }
  .sing-all-btn{
    border:none; border-radius:999px; padding:14px 24px; font-weight:800; font-size:16px; cursor:pointer;
    background:var(--coral); color:#fff; box-shadow:0 5px 0 color-mix(in srgb, var(--coral) 55%, #000 25%);
    margin-bottom:20px; font-family:'Baloo 2',sans-serif;
  }

  /* ---------- difficulty settings ---------- */
  .settings-panel{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    background:var(--surface); border-radius:16px; padding:12px 18px; margin:0 0 22px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .settings-panel .set-label{ font-weight:800; color:var(--ink-soft); font-size:14px; }
  .settings-panel label{ display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:14px; cursor:pointer; }
  .settings-panel input[type="checkbox"]{ width:19px; height:19px; accent-color:var(--sky); cursor:pointer; }
  .fallback-label{
    font-family:'Quicksand', sans-serif; font-weight:800; color:var(--ink);
    text-align:center; line-height:1.15; padding:4px; overflow-wrap:break-word;
    font-size:clamp(12px,3.4vw,16px);
  }

  /* ---------- subject hub ---------- */
  .subject-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .subject-head .icon-badge{
    --accent: var(--sky);
    width:52px; height:52px; border-radius:16px; font-size:28px;
    background:color-mix(in srgb, var(--accent) 20%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .subject-head h2{ font-size:26px; }

  .word-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-bottom:24px;
  }
  .word-card{
    background:var(--surface); border-radius:20px; padding:14px 10px 12px; text-align:center;
    border:none; cursor:pointer; box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .12s ease; color:var(--ink);
  }
  .word-card:hover{ transform:translateY(-2px); }
  .word-card:active{ transform:scale(.97); }
  .word-card .visual{ font-size:34px; line-height:1; margin-bottom:2px; }
  .word-card .swatch{ width:38px; height:38px; border-radius:50%; margin-bottom:2px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.12); font-size:19px; }
  .word-card .visual-img{ width:34px; height:54px; margin-bottom:2px; }
  .word-card .fr{ font-size:22px; font-weight:700; }
  .word-card .say{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .word-card .en{ font-size:12px; color:var(--ink-soft); }
  .word-card .speak-note{ font-size:16px; margin-top:2px; }

  .mode-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
  .mode-btn{
    --accent: var(--coral);
    border:none; border-radius:24px; cursor:pointer; text-align:left;
    padding:20px 22px; color:#fff;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000 12%));
    box-shadow:0 10px 0 color-mix(in srgb, var(--accent) 55%, #000 25%);
    display:flex; flex-direction:column; gap:6px;
    transition:transform .12s ease;
  }
  .mode-btn:hover{ transform:translateY(-3px); }
  .mode-btn:active{ transform:translateY(2px); box-shadow:0 5px 0 color-mix(in srgb, var(--accent) 55%, #000 25%); }
  .mode-btn .emo{ font-size:32px; }
  .mode-btn .title{ font-size:20px; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .mode-btn .desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- shared: progress dots + prompt card + choices ---------- */
  .progress-dots{ display:flex; gap:8px; margin:6px 0 20px; flex-wrap:wrap; }
  .progress-dots .dot{ width:14px; height:14px; border-radius:50%; background:color-mix(in srgb, var(--ink-soft) 30%, transparent); }
  .progress-dots .dot.done{ background:var(--bamboo); }
  .progress-dots .dot.current{ outline:3px solid var(--sky); outline-offset:2px; }

  .prompt-card{
    background:var(--surface); border-radius:28px; padding:34px 20px; text-align:center; margin-bottom:26px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
    cursor:pointer; border:none; width:100%; color:var(--ink);
  }
  .prompt-card .fr{ font-size:clamp(30px,8vw,56px); font-weight:700; line-height:1; }
  .prompt-card .say{ font-size:22px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .prompt-card .tap-hint{ font-size:14px; color:var(--ink-soft); margin-top:10px; font-weight:600; }
  .blank-mark{ display:inline-block; min-width:64px; border-bottom:4px solid var(--ink-soft); margin:0 6px; }

  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px; }
  .choice-tile{
    background:var(--surface); border:4px solid transparent; border-radius:22px; padding:20px 10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    transition:transform .1s ease, border-color .15s ease;
    aspect-ratio:1/1; color:var(--ink);
  }
  .choice-tile .visual{ font-size:44px; }
  .choice-tile .swatch{ width:48px; height:48px; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:24px; }
  .choice-tile .visual-img{ width:44px; height:70px; }
  .choice-tile:hover{ transform:translateY(-2px); }
  .choice-tile.correct{ border-color:var(--bamboo); animation: pop .5s ease; }
  .choice-tile.wrong{ animation: shake .4s ease; border-color:var(--coral); }

  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  /* ---------- memory game ---------- */
  .memory-grid{ display:grid; gap:12px; grid-template-columns:repeat(var(--cols,4), 1fr); }
  .flip-card{ perspective:800px; aspect-ratio:1/1; }
  .flip-card button{
    width:100%; height:100%; border:none; background:none; cursor:pointer; padding:0;
    position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.9,.3,1.1);
  }
  .flip-card.is-open button, .flip-card.is-matched button{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.10);
  }
  .flip-front{
    background:repeating-linear-gradient(135deg, var(--card-back-a) 0 14px, var(--card-back-b) 14px 28px);
    font-size:26px;
  }
  .flip-back{ background:var(--surface); transform:rotateY(180deg); padding:6px; text-align:center; color:var(--ink); }
  .flip-back .visual{ font-size:clamp(22px,6vw,36px); }
  .flip-back .swatch{ width:60%; aspect-ratio:1/1; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:clamp(14px,5vw,22px); }
  .flip-back .visual-img{ width:48%; height:64%; }
  .flip-back .fr{ font-size:clamp(11px,3vw,18px); line-height:1.15; font-weight:700; }
  .flip-back .say{ font-size:clamp(9px,2.4vw,12px); color:var(--ink-soft); font-weight:700; }
  .flip-back .fallback-label{ font-size:clamp(10px,2.8vw,14px); padding:2px; }
  .flip-card.is-matched .flip-back{ background:color-mix(in srgb, var(--bamboo) 22%, var(--surface)); }

  /* ---------- shared image chip ---------- */
  .visual-img{ display:inline-flex; align-items:flex-end; justify-content:center; }
  .visual-img img{ width:100%; height:100%; object-fit:contain; display:block; }

  .stat-row{ display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap; font-weight:700; color:var(--ink-soft); }
  .stat-row b{ color:var(--ink); }

  /* ---------- sentence builder ---------- */
  .sentence-prompt{
    background:var(--surface); border-radius:28px; padding:26px 20px; text-align:center; margin-bottom:22px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
  }
  .sentence-prompt .sent-visual{ margin-bottom:10px; display:flex; justify-content:center; }
  .sentence-prompt .sent-visual .visual-img{ width:64px; height:96px; }
  .sentence-prompt .sent-visual .visual{ font-size:56px; }
  .sentence-prompt .sent-visual .swatch{ width:64px; height:64px; font-size:30px; }
  .hear-btn{
    border:none; background:color-mix(in srgb, var(--sky) 16%, transparent); color:var(--ink);
    font-weight:800; border-radius:999px; padding:10px 20px; cursor:pointer; font-size:15px;
  }
  .assembly-row{ display:flex; gap:12px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
  .assembly-slot{
    min-width:110px; min-height:56px; border-radius:16px;
    border:3px dashed color-mix(in srgb, var(--ink-soft) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:8px 14px;
    font-weight:700; font-size:19px; color:var(--ink-soft);
    background:color-mix(in srgb, var(--surface) 60%, transparent); cursor:pointer;
  }
  .assembly-slot.filled{ border-style:solid; border-color:var(--sky); background:var(--surface); color:var(--ink); }
  .assembly-slot.wrong{ animation:shake .4s ease; border-color:var(--coral); }
  .assembly-slot.correct{ border-color:var(--bamboo); animation:pop .5s ease; }
  .tile-bank{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .word-tile{
    border:none; border-radius:16px; padding:14px 20px; font-weight:800; font-size:19px; cursor:pointer;
    background:var(--surface); box-shadow:0 4px 0 rgba(var(--shadow),0.1); color:var(--ink);
    transition:transform .1s ease;
  }
  .word-tile:active{ transform:translateY(2px); }
  .word-tile.used{ visibility:hidden; }
  .sentence-caption{ text-align:center; color:var(--ink-soft); font-weight:700; margin-top:10px; min-height:20px; }

  /* ---------- picture bingo ---------- */
  .bingo-call-row{ display:flex; align-items:center; gap:14px; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; }
  .repeat-btn{
    border:none; background:var(--surface); color:var(--ink); font-weight:800; border-radius:999px;
    padding:10px 20px; cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
  }
  .bingo-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:14px; margin-top:6px; }
  .bingo-tile{
    background:var(--surface); border-radius:18px; padding:10px 6px; border:4px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; aspect-ratio:1/1;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08); transition:transform .1s ease; color:var(--ink);
  }
  .bingo-tile .visual-img{ width:56px; height:82px; }
  .bingo-tile .visual{ font-size:clamp(34px,9vw,54px); }
  .bingo-tile .swatch{ width:56px; height:56px; font-size:28px; }
  .bingo-tile:hover{ transform:translateY(-2px); }
  .bingo-tile.marked{ border-color:var(--bamboo); background:color-mix(in srgb, var(--bamboo) 18%, var(--surface)); cursor:default; }
  .bingo-tile.wrong{ animation:shake .4s ease; border-color:var(--coral); }


  /* ---------- sound sort ---------- */
  .sort-buckets{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .sort-bucket{
    --accent: var(--sky);
    border:none; border-radius:24px; padding:24px 12px; cursor:pointer; color:#fff; text-align:center;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000 12%));
    box-shadow:0 8px 0 color-mix(in srgb, var(--accent) 55%, #000 25%);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px;
    transition:transform .1s ease;
  }
  .sort-bucket:active{ transform:translateY(2px); }
  .sort-bucket .b-icon{ font-size:34px; display:block; margin-bottom:4px; }
  .sort-bucket.wrong{ animation:shake .4s ease; }
  @media (max-width:480px){ .sort-buckets{ grid-template-columns:1fr; } }

  .sort-picker-grid{ display:flex; gap:12px; flex-wrap:wrap; margin:16px 0 22px; }
  .sort-chip{
    border:3px solid transparent; border-radius:999px; padding:10px 18px; font-weight:800; cursor:pointer;
    background:var(--surface); color:var(--ink); box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .sort-chip.selected{ border-color:var(--sky); background:color-mix(in srgb, var(--sky) 16%, var(--surface)); }

  /* ---------- completion overlay ---------- */
  .celebrate{
    background:var(--surface); border-radius:28px; padding:36px 26px; text-align:center;
    box-shadow:0 8px 30px rgba(var(--shadow),0.16); max-width:420px; margin:20px auto 0;
  }
  .celebrate .big-emoji{ font-size:56px; margin-bottom:6px; }
  .celebrate h2{ font-size:24px; margin-bottom:6px; }
  .celebrate p{ color:var(--ink-soft); font-weight:600; margin:0 0 20px; }
  .celebrate .stars-row{ font-size:34px; margin-bottom:22px; letter-spacing:4px; }
  .celebrate .btn-col{ display:flex; flex-direction:column; gap:10px; }
  .celebrate .btn{
    border:none; border-radius:16px; padding:14px; font-weight:800; font-size:15px; cursor:pointer;
    font-family:'Baloo 2',sans-serif;
  }
  .celebrate .btn.primary{ background:var(--bamboo); color:#0b3327; }
  .celebrate .btn.secondary{ background:color-mix(in srgb, var(--sky) 18%, transparent); color:var(--ink); }

  footer{ text-align:center; color:var(--ink-soft); font-size:13px; font-weight:600; margin-top:40px; }

  @media (prefers-reduced-motion: reduce){

  /* ============ small helpers ============ */
  function $(sel, root){ return (root||document).querySelector(sel); }

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function dotsHtml(total, idx){

  }

  /* ---- short feedback chimes (synthesized, no audio files needed) ---- */
  var audioCtx = null;
  function getAudioCtx(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function tone(ctx, freq, startTime, duration, gainPeak){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.22, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }
  function playCorrectSound(){
    var ctx = getAudioCtx(); if (!ctx) return;
    try{ var t = ctx.currentTime; tone(ctx, 523.25, t, 0.14); tone(ctx, 783.99, t + 0.11, 0.20); }catch(e){}
  }
  function playWrongSound(){
    var ctx = getAudioCtx(); if (!ctx) return;
    try{ var t = ctx.currentTime; tone(ctx, 233, t, 0.16, 0.18); tone(ctx, 196, t + 0.09, 0.22, 0.16); }catch(e){}
  }

  /* ---- French voice: picks a real French voice when the device has one ---- */
  var frVoice = null;
  function pickVoice(){
    try{
      var vs = window.speechSynthesis.getVoices() || [];
      var fr = vs.filter(function(v){ return /^fr(-|_|$)/i.test(v.lang); });
      var best = fr.filter(function(v){ return /fr[-_]FR/i.test(v.lang); });
      var pool = best.length ? best : fr;
      var nice = pool.filter(function(v){ return /(Google|Natural|Online|Amélie|Thomas|Audrey|Denise|Henri)/i.test(v.name); });
      frVoice = nice[0] || pool[0] || null;
    }catch(e){}
  }
  try{
    if ('speechSynthesis' in window){
      pickVoice();
      window.speechSynthesis.onvoiceschanged = pickVoice;
    }
  }catch(e){}

  function makeUtter(text){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if (frVoice) u.voice = frVoice;
    u.rate = SETTINGS.slow ? 0.6 : 0.85;
    return u;
  }
  function speak(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(makeUtter(text));
    }catch(e){}
  }
  /* Speak several French bits one after the other. */
  function speakSeq(texts, idx){
    idx = idx || 0;
    if (idx >= texts.length) return;
    try{
      if (!('speechSynthesis' in window)) return;
      if (idx === 0) window.speechSynthesis.cancel();
      var u = makeUtter(texts[idx]);
      u.onend = function(){ setTimeout(function(){ speakSeq(texts, idx+1); }, 300); };

    }catch(e){}

  /* ---- sentences ---- */
  function sentPre(s, w){ return w.pre || s.sentence.pre; }
  function sentWord(s, w){ return w.sfr || (s.sentence.useNoun ? w.noun : w.fr); }
  function sentenceFr(s, w){
    var t = sentPre(s, w).join(' ') + ' ' + sentWord(s, w) + s.sentence.end;
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function sentenceEn(s, w){
    var en = w.en;
    if (!/^The /.test(en) && !/^[A-Z][a-z]+day$/.test(en) && s.id !== 'countries') en = en.toLowerCase();
    if (s.id === 'countries') en = en.replace(/^The /,'the ');
    return (w.enPre || s.sentence.enPre) + en + s.sentence.enEnd;
  }

  /* ============ settings (per-device, local only) ============ */

  /* ============ MATCH-UP ============ */
  function renderMatch(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.match;
    if (!r || r.subjectId !== subjectId) r = RUN.match = { subjectId:subjectId, order:shuffle(s.words), idx:0, locked:false };
    if (r.idx >= r.order.length){ markDone(subjectId, 'match'); renderCelebrate(s, 'match'); return; }

    var target = r.order[r.idx];
    var choices = shuffle([target].concat(shuffle(s.words.filter(function(w){ return w !== target; })).slice(0,3)));

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Match-Up · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dotsHtml(r.order.length, r.idx)+'</div>'+
      '<button class="prompt-card" id="promptCard">'+
        '<div class="fr">'+escapeHtml(target.fr)+'</div>'+ sayHtml(target)+
        '<div class="tap-hint">🔊 Tap to hear it again</div>'+
      '</button>'+
      '<div class="choice-grid">'+choices.map(function(w, i){
        return '<button class="choice-tile" data-i="'+i+'">'+visualOrTextHtml(w)+'</button>';
      }).join('')+'</div>';

    backTo(subjectId, 'match');
    $('#promptCard', $('#app')).addEventListener('click', function(){ speak(target.fr); });
    speak(target.fr);

    $all('.choice-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        if (r.locked) return;
        if (choices[+tile.getAttribute('data-i')] === target){
          r.locked = true;
          tile.classList.add('correct');
          playCorrectSound();
          speak(target.fr);
          setTimeout(function(){ r.idx += 1; r.locked = false; renderMatch(subjectId); }, 900);
        } else {
          tile.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ MEMORY ============ */
  function renderMemory(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.memory;
    if (!r || r.subjectId !== subjectId){
      // big subjects: play with 8 random words so the board stays a sensible size
      var pool = s.words.length > 8 ? shuffle(s.words).slice(0,8) : s.words;
      var cards = [];
      pool.forEach(function(w){
        cards.push({ type:'text', word:w, matched:false });
        cards.push({ type:'visual', word:w, matched:false });
      });
      r = RUN.memory = { subjectId:subjectId, cards:shuffle(cards), open:[], busy:false, found:0, total:pool.length };
    }
    if (r.found === r.total){ markDone(subjectId, 'memory'); renderCelebrate(s, 'memory'); return; }

    var cols = r.cards.length <= 16 ? 4 : 5;
    var cardsHtml = r.cards.map(function(c, i){
      var isOpen = r.open.indexOf(i) !== -1;
      var stateClass = c.matched ? 'is-matched' : (isOpen ? 'is-open' : '');

      return '<div class="flip-card '+stateClass+'" data-i="'+i+'"><button aria-label="memory card">'+
        '<span class="flip-face flip-front">🥐</span><span class="flip-face flip-back">'+backInner+'</span></button></div>';
    }).join('');

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Memory · '+escapeHtml(s.name)+'</h2>'+
      '<div class="stat-row"><span>Pairs found: <b>'+r.found+' / '+r.total+'</b></span></div>'+
      '<div class="memory-grid" style="--cols:'+cols+'">'+cardsHtml+'</div>';

    backTo(subjectId, 'memory');
    $all('.flip-card', $('#app')).forEach(function(el){
      el.querySelector('button').addEventListener('click', function(){
        if (r.busy) return;
        var i = +el.getAttribute('data-i');
        var card = r.cards[i];
        if (card.matched || r.open.indexOf(i) !== -1) return;
        if (r.open.length === 0){ r.open = [i]; if (card.type === 'text') speak(card.word.fr); renderMemory(subjectId); return; }
        var first = r.cards[r.open[0]];
        r.open.push(i);
        if (first.word === card.word && first.type !== card.type){
          first.matched = card.matched = true;
          r.found += 1; r.open = [];
          playCorrectSound(); speak(card.word.fr);
          renderMemory(subjectId);
        } else {
          r.busy = true; playWrongSound(); renderMemory(subjectId);
          setTimeout(function(){ r.open = []; r.busy = false; renderMemory(subjectId); }, 900);
        }
      });
    });
  }

  /* ============ SENTENCE BUILDER ============ */
  function renderSentenceBuilder(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.sentence;
    if (!r || r.subjectId !== subjectId) r = RUN.sentence = { subjectId:subjectId, order:shuffle(s.words), idx:0, slots:null, bank:null, locked:false };
    if (r.idx >= r.order.length){ markDone(subjectId, 'sentence'); renderCelebrate(s, 'sentence'); return; }

    var word = r.order[r.idx];
    // the word itself: split "le pain" into "le" + "pain" (not "l'eau") so the article gets practised too
    var wordPart = [sentWord(s, word)];
    if (word.noun && wordPart[0] === word.fr && word.fr !== word.noun){
      var art = word.fr.slice(0, word.fr.length - word.noun.length);
      if (!/'$/.test(art)) wordPart = [art.trim(), word.noun];
    }
    var pieces = sentPre(s, word).concat(wordPart);
    pieces[0] = pieces[0].charAt(0).toUpperCase() + pieces[0].slice(1);
    if (!r.slots){
      r.slots = pieces.map(function(){ return null; });
      var bank = shuffle(pieces.map(function(_, i){ return i; }));
      if (pieces.length > 1){ var tries = 0; while (bank.every(function(v,i){ return v===i; }) && tries++ < 10) bank = shuffle(bank); }
      r.bank = bank;
    }
    var full = sentenceFr(s, word);

    var slotsHtml = r.slots.map(function(pi, i){
      return pi === null
        ? '<div class="assembly-slot" data-slot="'+i+'">?</div>'
        : '<div class="assembly-slot filled" data-slot="'+i+'">'+escapeHtml(pieces[pi])+'</div>';
    }).join('') + '<div class="sentence-end">'+escapeHtml(s.sentence.end.trim())+'</div>';
    var bankHtml = r.bank.map(function(pi){
      var used = r.slots.indexOf(pi) !== -1;
      return '<button class="word-tile'+(used?' used':'')+'" data-piece="'+pi+'">'+escapeHtml(pieces[pi])+'</button>';
    }).join('');

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Sentence Builder · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dotsHtml(r.order.length, r.idx)+'</div>'+
      '<div class="sentence-prompt">'+
        '<div class="sent-visual">'+visualOrTextHtml(word)+'</div>'+
        (SETTINGS.hideEnglish ? '' : '<div class="en-cap" style="font-weight:700;color:var(--ink-soft);margin-bottom:10px;">'+escapeHtml(sentenceEn(s, word))+'</div>')+
        '<button class="hear-btn" id="sbHear" type="button">🔊 Hear the sentence</button>'+
      '</div>'+
      '<div class="assembly-row">'+slotsHtml+'</div>'+
      '<div class="tile-bank">'+bankHtml+'</div>'+
      '<div class="sentence-caption" id="sbCaption"></div>';

    backTo(subjectId, 'sentence');
    $('#sbHear', $('#app')).addEventListener('click', function(){ speak(full); });
    if (r.slots.every(function(v){ return v === null; })) speak(full);

    $all('.word-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        if (r.locked) return;
        var pi = +btn.getAttribute('data-piece');
        if (r.slots.indexOf(pi) !== -1) return;
        var empty = r.slots.indexOf(null);
        if (empty === -1) return;
        r.slots[empty] = pi;
        if (r.slots.indexOf(null) === -1){
          // compare by text so identical tiles in either order still count
          var correct = r.slots.every(function(v, i){ return pieces[v] === pieces[i]; });
          r.locked = true;
          renderSentenceBuilder(subjectId);
          var slotEls = $all('.assembly-slot', $('#app'));
          if (correct){
            slotEls.forEach(function(el){ el.classList.add('correct'); });
            playCorrectSound(); speak(full);
            $('#sbCaption', $('#app')).textContent = '🎉 ' + full;
            setTimeout(function(){ r.idx += 1; r.slots = null; r.locked = false; renderSentenceBuilder(subjectId); }, 1600);
          } else {
            slotEls.forEach(function(el){ el.classList.add('wrong'); });
            playWrongSound();
            setTimeout(function(){ r.slots = pieces.map(function(){ return null; }); r.locked = false; renderSentenceBuilder(subjectId); }, 800);
          }
          return;
        }
        renderSentenceBuilder(subjectId);
      });
    });
    $all('.assembly-slot', $('#app')).forEach(function(el){
      el.addEventListener('click', function(){
        if (r.locked) return;
        var i = +el.getAttribute('data-slot');
        if (r.slots[i] !== null){ r.slots[i] = null; renderSentenceBuilder(subjectId); }
      });
    });
  }

  /* ============ LISTEN & FILL (fill-in-the-blank) ============ */
  function renderFillBlank(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.fillblank;
    if (!r || r.subjectId !== subjectId) r = RUN.fillblank = { subjectId:subjectId, order:shuffle(s.words), idx:0, locked:false };
    if (r.idx >= r.order.length){ markDone(subjectId, 'fillblank'); renderCelebrate(s, 'fillblank'); return; }

    var target = r.order[r.idx];
    var pre = sentPre(s, target);
    // distractors: prefer words whose sentence start is different (so only one answer makes sense)
    var others = s.words.filter(function(w){ return w !== target; });
    var diff = others.filter(function(w){ return sentPre(s, w).join(' ') !== pre.join(' '); });
    var pool = diff.length >= 3 ? diff : others;
    var choices = shuffle([target].concat(shuffle(pool).slice(0,3)));
    var full = sentenceFr(s, target);
    var preText = pre.join(' ');
    preText = preText.charAt(0).toUpperCase() + preText.slice(1);

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Listen &amp; Fill · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dotsHtml(r.order.length, r.idx)+'</div>'+
      '<button class="prompt-card" id="fbPrompt">'+
        '<div class="fr" style="font-size:clamp(24px,6vw,40px);line-height:1.3;">'+escapeHtml(preText)+' <span class="blank-mark" id="fbBlank">&nbsp;</span>'+escapeHtml(s.sentence.end.trim())+'</div>'+
        '<div class="tap-hint">🔊 Listen to the sentence, then pick the missing word</div>'+
      '</button>'+
      '<div class="choice-grid">'+choices.map(function(w, i){
        return '<button class="choice-tile" data-i="'+i+'">'+visualOrTextHtml(w)+'</button>';
      }).join('')+'</div>';

    backTo(subjectId, 'fillblank');
    $('#fbPrompt', $('#app')).addEventListener('click', function(){ speak(full); });
    speak(full);

    $all('.choice-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        if (r.locked) return;
        if (choices[+tile.getAttribute('data-i')] === target){
          r.locked = true;
          tile.classList.add('correct');
          $('#fbBlank', $('#app')).textContent = sentWord(s, target);
          playCorrectSound(); speak(full);
          setTimeout(function(){ r.idx += 1; r.locked = false; renderFillBlank(subjectId); }, 1500);
        } else {
          tile.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ PICTURE BINGO ============ */
  function renderBingo(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.bingo;
    if (!r || r.subjectId !== subjectId) r = RUN.bingo = { subjectId:subjectId, board:shuffle(s.words), calls:shuffle(s.words), calledIdx:0, marked:[] };
    if (r.marked.length === r.board.length){ markDone(subjectId, 'bingo'); renderCelebrate(s, 'bingo'); return; }
    var call = r.calls[r.calledIdx];

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Picture Bingo · '+escapeHtml(s.name)+'</h2>'+
      '<div class="bingo-call-row">'+
        '<span class="set-label" style="font-weight:800;color:var(--ink-soft);">🔔 Listen, then tap the picture!</span>'+
        '<button class="repeat-btn" id="bingoRepeat" type="button">🔊 Repeat</button>'+
      '</div>'+
      '<div class="stat-row"><span>Found: <b>'+r.marked.length+' / '+r.board.length+'</b></span></div>'+
      '<div class="bingo-grid">'+r.board.map(function(w, i){
        var marked = r.marked.indexOf(w) !== -1;
        return '<button class="bingo-tile'+(marked?' marked':'')+'" data-i="'+i+'">'+(marked ? '<span style="font-size:30px;">✅</span>' : visualOrTextHtml(w))+'</button>';
      }).join('')+'</div>';

    backTo(subjectId, 'bingo');
    $('#bingoRepeat', $('#app')).addEventListener('click', function(){ speak(call.fr); });
    speak(call.fr);

    $all('.bingo-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        var w = r.board[+tile.getAttribute('data-i')];
        if (r.marked.indexOf(w) !== -1) return;
        if (w === call){
          r.marked.push(w);
          playCorrectSound();
          r.calledIdx = Math.min(r.calledIdx + 1, r.calls.length - 1);
          setTimeout(function(){ renderBingo(subjectId); }, 700);
        } else {
          tile.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ SPELL IT ============
     Tap the letters in order. Spaces, hyphens and apostrophes are filled in for you.
     A wrong letter just wiggles — no penalty. 💡 shows which letter comes next. */
  function spellTarget(w){ return w.spell || w.noun || w.fr; }
  function isFixedChar(c){ return c === ' ' || c === '-' || c === "'"; }
  function renderSpell(subjectId){
    var s = findSubject(subjectId);
    var r = RUN.spell;
    if (!r || r.subjectId !== subjectId) r = RUN.spell = { subjectId:subjectId, order:shuffle(s.words), idx:0, pos:0, tiles:null, used:[], locked:false };
    if (r.idx >= r.order.length){ markDone(subjectId, 'spell'); renderCelebrate(s, 'spell'); return; }

    var w = r.order[r.idx];
    var target = spellTarget(w);
    var chars = target.split('');
    if (!r.tiles){
      r.tiles = shuffle(chars.map(function(c, i){ return { c:c, i:i }; }).filter(function(t){ return !isFixedChar(t.c); }));
      r.used = []; r.pos = 0;
    }
    while (r.pos < chars.length && isFixedChar(chars[r.pos])) r.pos++;
    var done = r.pos >= chars.length;

    var slots = chars.map(function(c, i){
      if (isFixedChar(c)) return '<div class="spell-slot fixed">'+(c === ' ' ? '&nbsp;' : escapeHtml(c))+'</div>';
      if (i < r.pos) return '<div class="spell-slot filled">'+escapeHtml(c)+'</div>';
      return '<div class="spell-slot'+(i === r.pos ? ' next' : '')+'"></div>';
    }).join('');
    var bank = r.tiles.map(function(t, k){
      return '<button class="letter-tile'+(r.used.indexOf(k)!==-1?' used':'')+'" data-k="'+k+'">'+escapeHtml(t.c)+'</button>';
    }).join('');
    var article = (w.noun && w.fr !== w.noun) ? w.fr.slice(0, w.fr.length - w.noun.length) : '';

    $('#app').innerHTML =
      topBack(s.name)+
      '<h2>Spell It · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dotsHtml(r.order.length, r.idx)+'</div>'+
      '<div class="sentence-prompt">'+
        '<div class="big-visual">'+visualOrTextHtml(w)+'</div>'+
        (SETTINGS.hideEnglish ? '' : '<div style="font-weight:800;font-size:18px;">'+escapeHtml(w.en)+'</div>')+
        (article ? '<div style="color:var(--ink-soft);font-weight:700;margin:4px 0 8px;">'+escapeHtml(article.trim())+' …</div>' : '<div style="height:8px"></div>')+
        '<button class="hear-btn" id="spHear" type="button">🔊 Hear the word</button>'+
      '</div>'+
      '<div class="spell-slots">'+slots+'</div>'+
      '<div class="letter-bank">'+bank+'</div>'+
      '<div class="tool-row"><button class="repeat-btn" id="spHint" type="button">💡 Hint</button></div>';

    backTo(subjectId, 'spell');
    $('#spHear', $('#app')).addEventListener('click', function(){ speak(w.fr); });
    if (done){
      r.locked = true;
      $all('.spell-slot.filled', $('#app')).forEach(function(el){ el.style.animation = 'pop .5s ease'; });
      playCorrectSound(); speak(w.fr);
      setTimeout(function(){ r.idx += 1; r.tiles = null; r.locked = false; renderSpell(subjectId); }, 1300);
      return;
    }

    if (r.used.length === 0) speak(w.fr);
    function norm(c){ return c.toLowerCase(); }
    $all('.letter-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        if (r.locked) return;
        var k = +btn.getAttribute('data-k');
        if (r.used.indexOf(k) !== -1) return;
        if (norm(r.tiles[k].c) === norm(chars[r.pos])){
          r.used.push(k);
          r.pos += 1;
          renderSpell(subjectId);
        } else {
          btn.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
        }
      });
    });
    $('#spHint', $('#app')).addEventListener('click', function(){
      for (var k=0;k<r.tiles.length;k++){
        if (r.used.indexOf(k) === -1 && norm(r.tiles[k].c) === norm(chars[r.pos])){
          var el = $('.letter-tile[data-k="'+k+'"]', $('#app'));
          if (el){ el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); }
          break;
        }
      }
    });
  }

  /* ============ LE, LA OU LES ? (gender) ============ */
  var G_LABEL = { m:'boy word 💙', f:'girl word 💗', pl:'lots of them' };
  function renderGender(subjectId){
    var s = findSubject(subjectId);

    if (r.idx >= r.order.length){ markDone(subjectId, 'gender'); renderCelebrate(s, 'gender'); return; }

    var w = r.order[r.idx];

        ['m','f','pl'].map(function(g){
          var acc = g === 'm' ? 'sky' : (g === 'f' ? 'coral' : 'bamboo');
          return '<button class="gender-btn" data-g="'+g+'" style="--accent:var(--'+acc+')"><span class="art">'+escapeHtml(A[g])+'</span><span class="lbl">'+G_LABEL[g]+'</span></button>';

          $('#gArt', $('#app')).style.color = 'var(--bamboo)';
          var elided = /'$/.test(w.fr.slice(0, w.fr.length - w.noun.length));
          if (elided) $('#gTip', $('#app')).textContent = 'Yes! It’s a girl word — but we write “'+w.fr+'” because it starts with a vowel.';
          else $('#gTip', $('#app')).textContent = '🎉 '+w.fr;
          playCorrectSound(); speak(w.fr);
          setTimeout(function(){ r.idx += 1; r.locked = false; renderGender(subjectId); }, elided ? 2600 : 1200);
        } else {
          btn.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ THE CATERPILLAR (put things in order) ============ */
  var CAT_COLOURS = ['#FCA5A5','#FDBA74','#FDE68A','#BEF264','#86EFAC','#67E8F9','#93C5FD','#C4B5FD','#F9A8D4','#FCD34D'];

    '<path d="M24 14 Q20 2 12 4" stroke="#6B7280" stroke-width="2.5" fill="none"/><circle cx="12" cy="4" r="3" fill="#A3E635"/>'+

    '<path d="M22 44 Q32 53 42 44" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
  function renderCaterpillar(){

    var bank = r.bank.map(function(w, k){
      var used = r.words.indexOf(w) < r.pos;
      return '<button class="word-tile'+(used?' used':'')+'" data-k="'+k+'">'+escapeHtml(w.fr)+'</button>';

    $('#app').innerHTML =
      topBack('Caterpillar')+

      '<div class="intro-line">'+(r.pos === 0 ? 'Which one comes first?' : 'What comes next?')+'</div>'+
      '<div class="caterpillar">'+CAT_HEAD+segs+'</div>'+
      '<div class="tile-bank">'+bank+'</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ RUN.caterpillar = null; renderCaterpillar(); });

    if (r.pos >= r.words.length){
      playCorrectSound();
      speakSeq([r.words.map(function(w){ return w.fr; }).join(', ') + ' !']);
      setTimeout(function(){ renderSimpleCelebrate('Bravo !', 'The caterpillar is all grown up! 🦋', 'caterpillar'); }, 1800);
      return;
    }
    $all('.word-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        if (r.locked) return;
        var w = r.bank[+btn.getAttribute('data-k')];
        if (w === r.words[r.pos]){
          speak(w.fr); playCorrectSound();
          r.pos += 1;
          renderCaterpillar();
        } else {
          btn.classList.add('wrong'); playWrongSound(); speak(w.fr);
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ SOUND SORT (cross-subject) ============ */
  var sortSelection = ['food', 'colours'];
  function renderSortPicker(){
    var canStart = sortSelection.length === 2;
    var chips = SUBJECTS.map(function(s){
      var sel = sortSelection.indexOf(s.id) !== -1;
      return '<button class="sort-chip'+(sel?' selected':'')+'" data-id="'+s.id+'">'+s.icon+' '+escapeHtml(s.name)+'</button>';
    }).join('');
    $('#app').innerHTML =
      topBack('Playroom')+
      '<h2>🔀 Sound Sort</h2>'+
      '<div class="intro-line">Pick 2 subjects to mix together.</div>'+
      '<div class="sort-picker-grid">'+chips+'</div>'+
      '<button class="mode-btn" id="startSortBtn" style="--accent:var(--purple);'+(canStart?'':'opacity:.5;')+'">'+
        '<span class="emo">▶️</span><span class="title">Start Sorting</span>'+
        '<span class="desc">'+(canStart ? 'Mix '+escapeHtml(findSubject(sortSelection[0]).name)+' + '+escapeHtml(findSubject(sortSelection[1]).name) : 'Choose exactly 2 subjects')+'</span>'+
      '</button>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.sort-chip', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var pos = sortSelection.indexOf(id);
        if (pos !== -1) sortSelection.splice(pos,1);
        else if (sortSelection.length < 2) sortSelection.push(id);
        renderSortPicker();
      });
    });
    $('#startSortBtn', $('#app')).addEventListener('click', function(){
      if (sortSelection.length === 2){ RUN.sort = null; go('soundSort'); }
    });
  }
  function renderSoundSort(){
    var aId = sortSelection[0], bId = sortSelection[1];
    if (!aId || !bId){ go('sortPicker'); return; }
    var a = findSubject(aId), b = findSubject(bId);
    var r = RUN.sort;
    if (!r || r.aId !== aId || r.bId !== bId){
      var items = shuffle(a.words).slice(0,6).map(function(w){ return { word:w, subjectId:aId }; })
        .concat(shuffle(b.words).slice(0,6).map(function(w){ return { word:w, subjectId:bId }; }));
      r = RUN.sort = { aId:aId, bId:bId, queue:shuffle(items), idx:0, locked:false };
    }
    if (r.idx >= r.queue.length){ renderSimpleCelebrate('All sorted!', 'You sorted '+a.name+' and '+b.name+' perfectly.', 'sortPicker'); return; }
    var current = r.queue[r.idx], word = current.word;

    $('#app').innerHTML =
      topBack('Playroom')+
      '<h2>🔀 Sound Sort · '+escapeHtml(a.name)+' + '+escapeHtml(b.name)+'</h2>'+
      '<div class="stat-row"><span>Sorted: <b>'+r.idx+' / '+r.queue.length+'</b></span></div>'+
      '<button class="prompt-card" id="soundSortPrompt">'+
        '<div class="fr">'+escapeHtml(word.fr)+'</div>'+ sayHtml(word)+
        '<div class="tap-hint">🔊 Tap to hear it again</div>'+
      '</button>'+
      '<div class="sort-buckets">'+
        '<button class="sort-bucket" data-id="'+a.id+'" style="--accent:var(--'+a.accent+')"><span class="b-icon">'+a.icon+'</span>'+escapeHtml(a.name)+'</button>'+
        '<button class="sort-bucket" data-id="'+b.id+'" style="--accent:var(--'+(b.accent === a.accent ? 'purple' : b.accent)+')"><span class="b-icon">'+b.icon+'</span>'+escapeHtml(b.name)+'</button>'+
      '</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ RUN.sort = null; go('home'); });
    $('#soundSortPrompt', $('#app')).addEventListener('click', function(){ speak(word.fr); });
    speak(word.fr);
    $all('.sort-bucket', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        if (r.locked) return;
        if (btn.getAttribute('data-id') === current.subjectId){
          r.locked = true; playCorrectSound(); speak(word.fr);
          setTimeout(function(){ r.idx += 1; r.locked = false; renderSoundSort(); }, 850);
        } else {
          btn.classList.add('wrong'); playWrongSound();
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ SONGS ============ */
  function findSong(id){ for (var i=0;i<SONGS.length;i++) if (SONGS[i].id === id) return SONGS[i]; return null; }
  function renderSongs(){
    $('#app').innerHTML =
      topBack('Playroom')+
      '<h2>🎵 Songs</h2>'+
      '<div class="intro-line">Pick a song to sing along, line by line.</div>'+
      SONGS.map(function(song){
        return '<button class="song-tile" data-song="'+song.id+'" style="--accent:var(--'+song.accent+')">'+
          '<span class="icon">'+song.icon+'</span>'+
          '<div><div class="song-title">'+escapeHtml(song.title)+'</div><div class="song-fr">'+escapeHtml(song.titleFr)+'</div></div></button>';
      }).join('');
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.song-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){ go('songDetail', btn.getAttribute('data-song')); });
    });
  }
  function renderSongDetail(songId){
    var song = findSong(songId);
    if (!song){ go('songs'); return; }
    $('#app').innerHTML =
      topBack('Songs')+
      '<h2>'+song.icon+' '+escapeHtml(song.titleFr)+'</h2>'+
      '<div class="intro-line">'+escapeHtml(song.title)+' — tap a line to hear it, or sing the whole song.</div>'+
      '<button class="sing-all-btn" id="singAllBtn" type="button">▶️ Sing the whole song</button>'+
      '<div>'+song.lines.map(function(line, i){
        return '<button class="song-line" data-i="'+i+'"><div class="fr">'+escapeHtml(line.fr)+'</div>'+
          (SETTINGS.hideEnglish ? '' : '<div class="en">'+escapeHtml(line.en)+'</div>')+'</button>';
      }).join('')+'</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('songs'); });
    $all('.song-line', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){ speak(song.lines[+btn.getAttribute('data-i')].fr); });
    });
    $('#singAllBtn', $('#app')).addEventListener('click', function(){
      speakSeq(song.lines.map(function(l){ return l.fr; }));
    });
  }

  /* ============ celebration screens ============ */
  function renderCelebrate(s, mode){
    var label = MODE_INFO[mode] ? MODE_INFO[mode].title : mode;
    $('#app').innerHTML =
      topBack(s.name)+
      '<div class="celebrate">'+
        '<div class="big-emoji">🎉</div>'+
        '<h2>Bravo !</h2>'+
        '<p>You finished '+escapeHtml(label)+' for '+escapeHtml(s.name)+'.</p>'+
        '<div class="stars-row">⭐⭐⭐</div>'+
        '<div class="btn-col">'+
          '<button class="btn primary" id="again">Play Again</button>'+
          '<button class="btn secondary" id="back">Back to '+escapeHtml(s.name)+'</button>'+
        '</div>'+
      '</div>';
    speak('Bravo !');
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('subject', s.id); });
    $('#back', $('#app')).addEventListener('click', function(){ go('subject', s.id); });
    $('#again', $('#app')).addEventListener('click', function(){ RUN[mode] = null; go(mode, s.id); });
  }
  function renderSimpleCelebrate(title, text, againView){
    $('#app').innerHTML =
      topBack('Playroom')+
      '<div class="celebrate">'+
        '<div class="big-emoji">🎉</div><h2>'+escapeHtml(title)+'</h2><p>'+escapeHtml(text)+'</p>'+
        '<div class="stars-row">⭐⭐⭐</div>'+
        '<div class="btn-col">'+
          '<button class="btn primary" id="again">Play Again</button>'+
          '<button class="btn secondary" id="back">Back to Playroom</button>'+
        '</div>'+
      '</div>';
    speak('Bravo !');
    function home(){ RUN = {}; go('home'); }
    $('.back-btn', $('#app')).addEventListener('click', home);
    $('#back', $('#app')).addEventListener('click', home);
    $('#again', $('#app')).addEventListener('click', function(){ RUN = {}; go(againView); });
  }

  /* ============ router ============ */
  var VIEWS = {
    subject: renderSubject, match: renderMatch, memory: renderMemory, sentence: renderSentenceBuilder,
    fillblank: renderFillBlank, bingo: renderBingo, spell: renderSpell, gender: renderGender,
    healthy: renderHealthy, caterpillar: renderCaterpillar, sortPicker: renderSortPicker, soundSort: renderSoundSort,
    songs: renderSongs, songDetail: renderSongDetail
  };
  function renderApp(){
    var fn = VIEWS[STATE.view];
    if (fn) fn(STATE.subjectId); else renderHome();
  }

  /* ============ hot-reload state carry (best effort) ============ */
  function persistHot(){
    try{
      if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
        window.claude.hot.snapshot(function(){ return { view: STATE.view, subjectId: STATE.subjectId }; });
      }
    }catch(e){}
  }
  function boot(data){
    if (data && data.view){
      var keep = ['subject','songs','songDetail'];
      STATE.view = keep.indexOf(data.view) !== -1 ? data.view : (data.subjectId && findSubject(data.subjectId) ? 'subject' : 'home');
      STATE.subjectId = data.subjectId || null;
      if (STATE.view === 'subject' && !findSubject(STATE.subjectId)) STATE.view = 'home';
    }
    renderApp();
    persistHot();
  }
  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
    else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }catch(e){ boot(null); }

})();
</script>

</body>
</html>
